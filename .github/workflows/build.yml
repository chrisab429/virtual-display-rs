name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions: write-all
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WDK is no longer pre-installed on windows-2022 images. Install
      # via choco + verify the install actually populated the registry
      # key wdf-umdf-sys reads (HKLM\Software\Microsoft\Windows Kits\
      # Installed Roots\KitsRoot10) and the umdf 2.31 include dir.
      - name: Install WDK
        run: |
          choco install windowsdriverkit11 -y --no-progress
          choco install windows-sdk-10-version-2104-all -y --no-progress
        shell: pwsh

      - name: Verify WDK install
        shell: pwsh
        run: |
          Write-Host "== installed roots registry =="
          Get-ItemProperty -Path "HKLM:\Software\Microsoft\Windows Kits\Installed Roots" -ErrorAction SilentlyContinue | Format-List
          Get-ItemProperty -Path "HKLM:\Software\WOW6432Node\Microsoft\Windows Kits\Installed Roots" -ErrorAction SilentlyContinue | Format-List
          Write-Host "== Windows Kits on disk =="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\" -ErrorAction SilentlyContinue | Format-Table Name -AutoSize
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\" -ErrorAction SilentlyContinue | Format-Table Name -AutoSize
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\km" -Directory -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize
          Write-Host "== UMDF 2.31 include dir? =="
          $umdf = "C:\Program Files (x86)\Windows Kits\10\Include\wdf\umdf\2.31"
          Test-Path $umdf
          if (Test-Path $umdf) { Get-ChildItem $umdf | Select-Object Name -First 5 | Format-Table -AutoSize }
          Write-Host "== UMDF dirs (any version) =="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\wdf\umdf\" -Directory -ErrorAction SilentlyContinue | Format-Table Name -AutoSize

      # The choco WDK package may install kit headers under a non-default
      # subpath and skip writing the KitsRoot10 registry value. Stamp
      # it so wdf-umdf-sys's build.rs can locate the kit.
      - name: Stamp KitsRoot10 registry
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\",
            "C:\Program Files\Windows Kits\10\"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              New-Item -Path "HKLM:\Software\Microsoft\Windows Kits\Installed Roots" -Force | Out-Null
              Set-ItemProperty -Path "HKLM:\Software\Microsoft\Windows Kits\Installed Roots" -Name "KitsRoot10" -Value $c -Type String
              Write-Host "KitsRoot10 stamped: $c"
              break
            }
          }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.event_name == 'release' && 'prod' || 'dev' }}

      # cargo-make latest now uses lockfile v4 which our pinned
      # nightly-2023-09-19 toolchain can't parse. Pin to a release
      # known to use lockfile v3.
      - name: Install cargo-make
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-make
          version: "0.37.10"

      - name: Install cargo-target-dir
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-target-dir
          git: https://github.com/MolotovCherry/cargo-target-dir

      - name: Install cargo-wix
        if: github.event_name == 'release'
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-wix

      - name: Export Private Certificate
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          $env:PRIVATE_KEY | Out-File -FilePath private.txt
          certutil -decode private.txt private.pfx

      - name: Export PR Private Certificate
        if: github.event_name == 'pull_request'
        run: cp .github/workflows/build_res/pr.pfx private.pfx

      - name: Export Public Certificate
        env:
          PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '1234' || secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          Get-PfxCertificate -FilePath private.pfx -Password (ConvertTo-SecureString -String "${{ env.PRIVATE_KEY_PASSWORD }}" -AsPlainText -Force) | Export-Certificate -FilePath DriverCertificate.cer -type CERT

      - name: Build
        env:
          PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '1234' || secrets.PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ github.event_name == 'release' && 'prod' || 'dev' }}
        run: cargo make -p $env:RELEASE build

      # actions/upload-artifact@v4 disallows multiple uploads with the
      # same artifact name in one run, so the three original calls have
      # been merged into one. Glob each desired root file at top level.
      - name: Upload Artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: driver
          path: |
            target/output/*.exe
            target/output/*.cat
            target/output/*.dll
            target/output/*.inf
            DriverCertificate.cer
            installer/install-cert.bat

      - name: Set release version
        if: github.event_name == 'release'
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          $version = $tagName.TrimStart('v')
          echo "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # package with wix
      - name: Create installer
        if: github.event_name == 'release'
        run: |
          cargo wix -p virtual-display-driver -i ${{ env.RELEASE_VERSION }} --nocapture -I installer/main.wxs -o target\output -C -ext -C WixDifxAppExtension -L -ext -L WixDifxAppExtension -L "C:\Program Files (x86)\WiX Toolset v3.11\bin\difxapp_x64.wixlib"

      - name: Sign installer
        if: github.event_name == 'release'
        shell: cmd
        env:
          PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '1234' || secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          signtool sign /a /fd SHA256 /v /f private.pfx /p ${{ env.PRIVATE_KEY_PASSWORD }} /t http://timestamp.digicert.com target/output/*.msi

      - name: Zip up install package
        if: github.event_name == 'release'
        run: |
          Get-ChildItem -Path DriverCertificate.cer, installer/install-cert.bat, target/output/*.msi | Compress-Archive -CompressionLevel Optimal -DestinationPath "virtual-desktop-driver-installer-x64.zip"

      - name: Zip up portable package
        if: github.event_name == 'release'
        run: |
          Get-ChildItem -Path DriverCertificate.cer, installer/install-cert.bat, target/output/*.inf, target/output/*.dll, target/output/*.cat, target/output/*.exe, installer/files/*.reg | Compress-Archive -CompressionLevel Optimal -DestinationPath "virtual-desktop-driver-portable-x64.zip"

      - name: Attach assets to release
        if: github.event_name == 'release'
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.zip"
          draft: false
          release_id: ${{ github.event.release.id }}
